[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gsrr-agent-harness"
version = "0.1.0"
description = "A bounded runnable case study of governed state realization and agent-directed system implementation."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { file = "LICENSE" }
authors = [
    { name = "Robert Hansen" }
]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8,<9"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]