  - TransitionAuthorized
  - ExecutionPlanValidated
  - TransitionCommitted
  - ExecutionCompleted
  - TransitionReconciled
  - StateProjected
  expected_final_authoritative_state: REVIEW independently in A and B
  expected_final_projection: One PROJECT/APPLIED per isolated alternative, never two sequential effects on one live state
