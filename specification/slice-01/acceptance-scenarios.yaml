- scenario_id: S01-T08
  name: Same approved WHAT through two compliant HOW paths
  base_realization_mode: BOTH_IN_ISOLATED_ALTERNATIVES
  retry_enabled: false
  setup: Create one immutable DOC-001 DRAFT->REVIEW CandidateTransition, ApprovedTransition, ExecutionEnvelope, definition,
    active grant and source snapshots. Snapshot the fixture at the pre-realization boundary. Fork two isolated test executions
    from that same immutable prefix; do not invoke A and then B sequentially on an already changed live object.
  paths:
  - path: A
    mode: EXPLICIT_PLAN
    how: GSRR PLANNER generates the one-step fixed-input plan; capability handler performs the validated operation.
  - path: B
    mode: DELEGATED_REALIZATION
    how: Coordinator deterministically binds one capability responsibility without invoking GSRR PLANNER; provider derives
      its internal pure procedure and requests the one allowed mediated update.
  identity_comparison: Compare approval, transition, envelope, original snapshots, definition and authority records byte-for-byte
    between alternatives. Each isolated run branch owns separate effect/journal/index state; existing prefix run_id is unchanged
    in cloned fixtures. Unique new plan/validation/commit identities within each branch; branch labels are test harness metadata,
    not new authority.
  assertions:
  - 'A invokes external PLANNER once; B invokes it zero times. Instrument provider internal planning: absent in A, present
    in B. A mere mode-label change fails.'
  - Both modes bind supported descriptor, exact fixed_input, complete envelope obligations and all normal conformance/admission/freshness
    gates.
  - Each isolated path invokes capability once, independently observes REVIEW/version2 with predecessor1 and matching own
    commit, unchanged digest/existence and complete provider action history.
  - Both RECONCILED_SUCCESS, then retained PROJECT/APPLIED with authority REVIEW/version2 only after final fresh checks and
    atomic publication.
  - Both retain identical approved WHAT, required grant and envelope; plan/commit identities and HOW ownership may differ
    without broader permission.
  - Provider pure internal planning need not be journaled; all effects are mediated. Opacity, native SUCCESS alone, or unsatisfied
    trust/evidence fails equivalence.
  variants:
  - variant_id: T08-V01
    setup: Delegated provider changes target or requests forbidden content/deletion/direct APPROVED/PUBLISHED; also test mutate-restore
      and deletion-recreation through trusted diagnostic mediator.
    expected: Prevent and record, or detect applied violation; RECONCILIATION_FAILED with retained DO_NOT_PROJECT, zero authoritative
      admission and no effect retry.
  - variant_id: T08-V02
    setup: Keep target but drop required independent evidence; separately return false native SUCCESS.
    expected: Missing evidence holds; complete unchanged DRAFT fails. Both retain negative decisions; S01-T05 remains valid.
  - variant_id: T08-V03
    setup: After validated binding substitute mode or plan; separately use approval specifically bound to old plan for a new
      mode plan.
    expected: No mutation/approval transfer; reject mismatch or require explicit reauthorization under supplied policy; no
      new authority by mode choice.
  - variant_id: T08-V04
    setup: Delegated provider internal planning fails after commit without any observed write.
    expected: Admission latch still prevents automatic successor or redispatch. Retain failure and finish independent reconciliation/negative
      decision.
