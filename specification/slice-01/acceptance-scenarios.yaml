universal_assertions:
- All mandatory references resolve to retained immutable records; exact original source and definition bindings preserved.
- Every created attempt is counted once; every failed attempt remains terminal; no unapproved effects or definition mutation.
- For every completed final projection evaluation exactly one immutable final decision is retained, even if negative; no fabricated
  evaluation for pre-dispatch refusal.
- Failure injection is deterministic bounded test data; executable verification is performed by the public pytest suite.
