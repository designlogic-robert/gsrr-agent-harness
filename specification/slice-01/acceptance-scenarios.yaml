diagnostic_case_groups:
- scenario_id: RS-V01
  name: Closed-fixture forbidden-action coverage
  requirement_refs:
  - S01-R06
  - S01-R11
  - S01-R13
  - S01-R15
  setup: Start from T01 valid commit; trusted fault injection uses the provider mediator.
  cases:
  - input: content write then restore, followed by REVIEW
    expected: Complete ledger records both applied content writes; FAILED; DO_NOT_PROJECT even if final digest matches.
  - input: delete then recreate, followed by REVIEW
    expected: Existence history records deletion; FAILED; DO_NOT_PROJECT even when exists=true.
  - input: state APPROVED then REVIEW; separately PUBLISHED then REVIEW
    expected: Each prohibited intermediate state is in complete ledger; FAILED; DO_NOT_PROJECT.
  - input: wrong-object, definition-write or nested invocation request
    expected: Mediator/dispatch interface refuses and records attempted action; no permitted side effect; known failure prohibits
      projection.
  - input: provider interval missing/incomplete despite target-like final snapshot
    expected: UNRESOLVED unless a higher-priority violation exists; HOLD_PROJECTION; no absence assertion.
  expected_artifacts: Exact payload, independent snapshot/action history, per-prohibition findings and final negative decision;
    authoritative DRAFT.
  expected_events:
  - IntentStructured
  - CandidateSelected
  - TransitionValidated
  - TransitionAuthorized
  - ExecutionPlanValidated
  - TransitionCommitted
  - ExecutionCompleted
  - ReconciliationFailed
  - TransitionRefused or TransitionHeld
  scope: Data-only mediated fixture, not arbitrary host security.
- scenario_id: RS-V02
  name: Five reachable outcomes and precedence
  requirement_refs:
  - S01-R13
  - S01-R14
  - S01-R15
  setup: Use only one required state effect and declared independent evidence variants.
  cases:
  - outcome: RECONCILED_SUCCESS
    input: SUCCESS report; REVIEW-only complete ledger; all identity/version/grant/postconditions valid
    expected: Eligible for final fresh gate; PROJECT only if publication succeeds.
  - outcome: RECONCILIATION_FAILED
    input: SUCCESS report and unchanged DRAFT baseline with complete empty action interval
    expected: DO_NOT_PROJECT; authority unchanged.
  - outcome: STALE_STATE
    input: Current authority v2 replaces approved v1; no known invocation violation
    expected: HOLD_PROJECTION; preserve current authority.
  - outcome: RECONCILIATION_AMBIGUOUS
    input: Two complete same-version observations conflict without known unrelated write, or UNKNOWN report attribution
    expected: HOLD_PROJECTION; retain both.
  - outcome: UNRESOLVED
    input: Required provider observation or complete interval unavailable; no higher finding
    expected: HOLD_PROJECTION; do not default to no effects.
  - input: known forbidden invocation write plus stale version plus missing remaining evidence
    expected: FAILED with all stale/unresolved findings retained; no positive absence claim.
  expected_artifacts: One five-outcome ReconciliationResult and final ProjectionDecision per terminal evaluation.
  expected_events: Comparison outcome followed by final decision event when available.
  scope: PARTIAL_REALIZATION is not an active producer/consumer value or required runtime case.
- scenario_id: RS-V03
  name: Immutable dispatch payload substitution
  requirement_refs:
  - S01-R07
  - S01-R08
  - S01-R09
  - S01-R11
  setup: Valid immutable envelope/plan/validation/commit; alter presented commit/key/implementation/object or add an input
    field.
  expected: Equality guard refuses before invocation; original plan/commit remain unchanged; no projection evaluation. Matching
    payload invokes exactly once.
  expected_artifacts: Original immutable records and failed guard evidence; no ExecutionResult for an unstarted invocation.
  expected_events: Commit prefix then refusal/hold; no ExecutionCompleted.
  scope: One fixture invocation; no production signature requirement.
- scenario_id: RS-V04
  name: Final projection denial and publication failure
  requirement_refs:
  - S01-R15
  - S01-R16
  - S01-R17
  setup: Reconciliation succeeds; final evaluation outcome retention was established before evaluation.
  cases:
  - input: Known final gate failure
    expected: Retained DO_NOT_PROJECT; changed=false; no StateProjected.
  - input: Stale or unresolved final gate
    expected: Retained HOLD_PROJECTION; changed=false.
  - input: Injected authority write/event preparation/publication failure before local aggregate replacement
    expected: Retained DO_NOT_PROJECT / FAILED in pre-established outcome slot; unchanged authority; no StateProjected; journal_record_status=UNAVAILABLE
      when append failed.
  - input: Outcome retention unavailable before evaluation
    expected: Hold before evaluation starts; no terminal evaluation or write claimed; no fabricated final record.
  expected_artifacts: Final immutable decision with inputs/checks/causation and retained outcome reference for each completed
    evaluation.
  expected_events: StateProjected only on success; refusal/hold on available journal; explicit unavailable status in retained
    failed decision otherwise.
  scope: No guarantee across total in-memory run loss; no distributed transactions.
- scenario_id: RS-V05
  name: Historical duplicate before fresh execution
  requirement_refs:
  - S01-R02
  - S01-R10
  - S01-R20
  setup: Complete T01 to authority v2; resubmit original key and immutable tuple.
  cases:
  - input: Exact old key/tuple
    expected: Return same commit/result/decision as HISTORICAL_RETRIEVAL; zero fresh domain reads, zero new invocation/projection.
  - input: Same key changed tuple
    expected: Refuse; do not reinterpret changed parameters as prior result.
  - input: Prior key with incomplete/unknown retained attempt
    expected: Return held/incomplete retained status; no retry or invented result.
  expected_artifacts: Existing records only plus optional retrieval observation; current authority not overwritten.
  expected_events: No new successful execution or projection events.
  scope: Same retained run only; no restart replay promise.
- scenario_id: RS-V06
  name: Current authority changes without state version change
  requirement_refs:
  - S01-R05
  - S01-R15
  setup: T01 reconciliation succeeds; fixture grant active flag changes before final gate while both state versions remain
    equal.
  expected: Known inactive grant -> final DO_NOT_PROJECT; unresolved grant -> HOLD_PROJECTION; no authoritative write/StateProjected.
  expected_artifacts: Current grant check, same version evidence and retained final decision.
  expected_events: TransitionReconciled followed by projection-gate refusal/hold.
  scope: Trusted fixture grant only; no real IAM/revocation protocol.
