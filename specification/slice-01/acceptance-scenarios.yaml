    failure_class: GENERATED_PLAN_ENVELOPE_VIOLATION
    supervisory_disposition: REJECT_RETRYABLE
    terminal: true
    commit_count: 0
    dispatch_count: 0
    effects_count: 0
    retained_failure: true
  - step: 3
    checks: Original versions/definition/target/grant/exact approval subject/envelope unchanged; no scope admission/possible
      effect; terminal history retained; budget remains.
    event: NewAttemptAuthorized
    next_attempt_id: ATTEMPT-B
    attempts_created_before: 1
    attempts_created_after: 2
  - step: 4
    attempt_id: ATTEMPT-B
    attempt_number: 2
    prior_attempt_id: ATTEMPT-A
    plan_id: PLAN-B
    event: AttemptStarted
    same_approval_and_envelope: true
  - step: 5
    attempt_id: ATTEMPT-B
    plan_result: REFUSED
    terminal: true
    commit_count: 0
    dispatch_count: 0
    effects_count: 0
    retained_failure: true
  - step: 6
