  name: Terminal plan failures, distinct successor and finite circuit
  setup: Valid retained ApprovedTransition DOC-001 DRAFT -> REVIEW and unchanged validated envelope; trusted no-effect generator;
    policy explicitly enables GENERATED_PLAN_ENVELOPE_VIOLATION.
  initial_state: Authoritative DRAFT authority_version=1; observed DRAFT observation_version=1; definition and external scoped
    grant valid; no admission/dispatch.
  retry_policy:
    retry_enabled: true
    allowed_failure_classes:
    - GENERATED_PLAN_ENVELOPE_VIOLATION
    max_attempts: 2
    repeated_failure_threshold_or_null: null
  sequence:
  - step: 1
    attempt_id: ATTEMPT-A
    attempt_number: 1
    prior_attempt_id: null
    plan_id: PLAN-A
    event: AttemptStarted
    attempts_created: 1
  - step: 2
    attempt_id: ATTEMPT-A
